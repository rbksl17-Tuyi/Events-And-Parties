
name: Publicar web Events and Parties

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - '.github/workflows/publicar-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar web
        uses: actions/upload-pages-artifact@v3
        with:
          path: WWW

      - name: Publicar web
        id: deployment
        uses: actions/deploy-pages@v4
